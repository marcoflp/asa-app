<div>
  <p class="data">{{ agora | date: "EEEE, d 'de' MMMM" }}</p>
  <h1>{{ saudacao() }}</h1>
  @if (temAtendimentoHoje) {
    <p class="aviso">
      <asa-icone nome="relogio" /> Hoje tem atendimento, {{ configuracao().horarioDeAtendimento }}
    </p>
  }
</div>
<nav aria-label="Ações principais">
  <a class="botao principal" [href]="configuracao().rotas.novaRetirada">
    <asa-icone nome="adicionar" /> Registrar retirada
  </a>
  <a class="botao" [href]="configuracao().rotas.novaFamilia">
    <asa-icone nome="adicionar-pessoa" /> Cadastrar família
  </a>
</nav>
